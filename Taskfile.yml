version: "3"

# tinyroute dev workflow.
#   APP_PORT   = where the Go gateway listens (TINYROUTE_LISTEN default 8787).
#   Vite dev   = runs on http://localhost:5173 with proxy to http://localhost:8787.
#   Vite build = outputs production bundle to internal/dashboard/dist/ (go:embed all:dist).
vars:
  APP_PORT: "8787"

tasks:
  build:web:
    desc: Build Vite + React + Tailwind CSS dashboard to internal/dashboard/dist
    dir: web
    cmds:
      - pnpm build

  dev:web:
    desc: Run Vite dev server for web dashboard with HMR (http://localhost:5173)
    dir: web
    cmds:
      - pnpm dev

  dev:gateway:
    desc: Run Go tinyroute gateway daemon
    cmds:
      - go run . serve

  dev:
    desc: Start hot-reload dev environment (Go gateway + Vite frontend)
    cmds:
      - task --parallel dev:gateway dev:web

  test:
    desc: Run all Go unit & integration tests
    cmds:
      - go test ./...

  build:
    desc: Build frontend assets and Go tinyroute binary
    cmds:
      - task: build:web
      - go build -v -o bin/tinyroute .